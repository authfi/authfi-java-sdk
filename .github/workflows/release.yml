# Publishes the library to Maven Central when a version tag (vX.Y.Z) is pushed. Maven Central has no OpenID
# Connect login, so the publish uses a Central Portal user token and a GPG signing key. They are secrets of the
# `maven-central` environment only (CENTRAL_USERNAME, CENTRAL_TOKEN, GPG_PRIVATE_KEY, GPG_PASSPHRASE), never
# repository secrets, so only the publish job after a reviewer's approval can read them. The build and the tests
# run first without any of them.
name: Release to Maven Central

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag on the wrong commit must fail here: a version on Maven Central can never be replaced or removed.
      - name: The tag is a version on main, with a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          v="${TAG#v}"
          grep -Eq "^## \[?${v//./\.}\]?( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: The pom version is the tag's
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pom="$(mvn -B -q help:evaluate -DforceStdout -Dexpression=project.version)"
          [ "$pom" = "${TAG#v}" ] || { echo "::error::pom version ($pom) does not match tag ($TAG)"; exit 1; }
          if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/io/authfi/authfi-sdk/$pom/authfi-sdk-$pom.pom"; then
            echo "::error::$pom is already on Maven Central"; exit 1
          fi
      - run: mvn -B verify

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.authfi/authfi-sdk
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      # The tests passed in the build job on this same commit. The release profile signs the jars and uploads them.
      # A fixed output timestamp makes the jar the same bytes on every build of this commit.
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release deploy -DskipTests "-Dproject.build.outputTimestamp=$(git log -1 --format=%cI)"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/authfi-sdk-*.jar
