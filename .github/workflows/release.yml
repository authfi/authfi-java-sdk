name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0) — must match pom.xml'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify pom version matches tag
        if: github.event_name == 'push'
        run: |
          POM_VERSION=$(mvn help:evaluate -q -DforceStdout -Dexpression=project.version)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pom version ($POM_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Deploy to Sonatype Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release deploy
